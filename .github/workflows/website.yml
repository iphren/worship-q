name: Website

# Builds worship-q.com and publishes it to GitHub Pages. It runs when a release is published,
# so the page names the version its buttons serve, and when the site itself changes. After
# pointing "latest" at another release by hand, run it from the Actions tab.
#
# The screenshots on the page are rendered from the app's code first (apps/screenshots), on
# macOS so the text is drawn in the Mac app's system font.

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: [apps/website/**, apps/screenshots/**, .github/workflows/website.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  screenshots:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @worship-q/screenshots exec playwright install chromium
      - run: pnpm screenshots screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: error

  build:
    needs: screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: apps/website/public/screenshots
      - run: pnpm --filter @worship-q/website build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  # Tells Bing (and through it ChatGPT search and Copilot) and the other IndexNow engines that
  # the site changed, so a new release is crawled within hours. The key is the file in
  # apps/website/public named after it. A failed ping never fails the deploy.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d '{"host":"worship-q.com","key":"d0de7861dfc420c4e31cfe9ff3e0fde6","keyLocation":"https://worship-q.com/d0de7861dfc420c4e31cfe9ff3e0fde6.txt","urlList":["https://worship-q.com/"]}' \
            -w 'IndexNow: HTTP %{http_code}\n' || true
