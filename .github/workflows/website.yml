name: Website

# Builds worship-q.com and publishes it to GitHub Pages. It runs when a release is published,
# so the page names the version its buttons serve, and when the site itself changes. After
# pointing "latest" at another release by hand, run it from the Actions tab.
#
# The screenshots on the page are rendered from the app's code first (apps/screenshots), on
# Linux with Inter standing in for the system font (apps/screenshots/linux). Their run sheet is
# dated the next Sunday, so the site is also rebuilt every Monday.

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - apps/website/**
      - apps/screenshots/**
      # The guides are pages of the site, in each of its languages.
      - docs/volunteer-guide.md
      - docs/server-deployment.md
      - docs/zh-hans/**
      - docs/zh-hant/**
      # The app's words appear in the Chinese screenshots.
      - packages/i18n/src/**
      - .github/workflows/website.yml
  workflow_dispatch:
  # Every Monday morning, so the screenshots' run sheet is always the coming Sunday's.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: apps/screenshots/linux/setup.sh
      - run: pnpm screenshots apps/website/public/screenshots
      # The Chinese pages show the app in Chinese, with Chinese songs and Bible.
      - run: pnpm screenshots apps/website/public/screenshots/zh-hans
        env:
          SCREENSHOT_LANG: zh-Hans
      - run: pnpm screenshots apps/website/public/screenshots/zh-hant
        env:
          SCREENSHOT_LANG: zh-Hant
      - run: pnpm --filter @worship-q/website build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  # Tells Bing (and through it ChatGPT search and Copilot) and the other IndexNow engines that
  # the site's pages changed, so a new release is crawled within hours. The key is the file in
  # apps/website/public named after it. A failed ping never fails the deploy.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      # Every page in the sitemap just deployed, so new pages are announced with the rest.
      - run: |
          urls=$(curl -sS https://worship-q.com/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' | jq -R . | jq -sc .)
          [ "$urls" != "[]" ] || urls='["https://worship-q.com/"]'
          echo "IndexNow: $(echo "$urls" | jq length) pages"
          jq -nc --argjson urls "$urls" '{host: "worship-q.com", key: "d0de7861dfc420c4e31cfe9ff3e0fde6", keyLocation: "https://worship-q.com/d0de7861dfc420c4e31cfe9ff3e0fde6.txt", urlList: $urls}' |
            curl -sS -X POST https://api.indexnow.org/indexnow \
              -H 'Content-Type: application/json; charset=utf-8' --data-binary @- \
              -w 'IndexNow: HTTP %{http_code}\n' || true
