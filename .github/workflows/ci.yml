name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The router page must carry its script inline; the build fails if it would load a file.
      - name: Build the link router
        run: |
          pnpm --filter @worship-q/router build
          grep -q '<script type="module">' apps/router/dist/j/index.html
          test -f apps/router/dist/.well-known/apple-app-site-association
          test -f apps/router/dist/.well-known/assetlinks.json

  # Unsigned, to catch build breaks before merging; releases are built by release.yml.
  build:
    needs: check
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: worship-q-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # The phone and tablet app's Rust core, so a desktop change cannot break it unseen
  # (native apps plan M2.2). Compiled, not built: signing and store uploads are separate.
  mobile:
    needs: check
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-ios
          - os: ubuntu-latest
            target: aarch64-linux-android
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      # The interface is compiled into the app, so it must exist.
      - run: pnpm --filter @worship-q/desktop build
      - name: Compile for ${{ matrix.target }}
        working-directory: apps/desktop/src-tauri
        run: |
          if [ "${{ matrix.target }}" = aarch64-linux-android ]; then
            # The built-in OpenSSL needs the NDK's compiler and tools by these names.
            bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
            export CC_aarch64_linux_android="$bin/aarch64-linux-android29-clang"
            export AR_aarch64_linux_android="$bin/llvm-ar"
            export RANLIB_aarch64_linux_android="$bin/llvm-ranlib"
          fi
          cargo check --locked --target ${{ matrix.target }}
