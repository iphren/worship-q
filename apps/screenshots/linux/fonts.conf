<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Linux has none of the fonts the app asks for (the system UI font, Helvetica): Inter draws
     them all, so the screenshots look the same on every Linux machine. -->
<fontconfig>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Helvetica Neue</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Helvetica</family>
    <prefer><family>Inter</family></prefer>
  </alias>
</fontconfig>
