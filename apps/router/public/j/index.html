<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Worship Q</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8fafc;
        --text: #0f172a;
        --muted: #475569;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a;
          --text: #f1f5f9;
          --muted: #94a3b8;
        }
      }
      body {
        min-height: 100vh;
        margin: 0;
        padding: 16px;
        box-sizing: border-box;
        display: grid;
        place-content: center;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
      }
      p {
        max-width: 28rem;
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Worship Q</h1>
      <p id="message">The Worship Q phone app is not available yet.</p>
    </main>
    <script>
      // A holding page for the M0 spike. It never reads the address's fragment and loads nothing.
      (function () {
        var language = (navigator.language || '').toLowerCase();
        if (language.indexOf('zh') !== 0) return;
        var traditional = /hant|-tw|-hk|-mo/.test(language);
        document.documentElement.lang = traditional ? 'zh-Hant' : 'zh-Hans';
        document.getElementById('message').textContent = traditional
          ? 'Worship Q 手機應用程式尚未推出。'
          : 'Worship Q 手机应用尚未推出。';
      })();
    </script>
  </body>
</html>
