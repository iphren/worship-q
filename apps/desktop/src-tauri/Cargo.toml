[package]
name = "worship-q"
version = "0.5.1"
description = "Worship Q desktop app"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "worship_q_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` for a second webview in the slideshow window, which shows a presented website.
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
fontdb = "0.23"
ttf-parser = "0.25"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-window-state = "2"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
tokio = { version = "1", features = ["net", "sync", "macros"] }
# The platform's own TLS: Security framework on macOS, SChannel on Windows.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls", "http2"] }
# Automatic updates, from the latest GitHub Release, and restarting into them.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
