# docker compose -f apps/server/compose.yaml up -d --build   (run from the repository root)
services:
  worship-q:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      WORSHIP_Q_NAME: ${WORSHIP_Q_NAME:-Worship Q}
      # Administrator sign-in (phase 3): the church's OpenID Connect provider, and this
      # server's public address. Without them the admin app is unavailable.
      WORSHIP_Q_OIDC_ISSUER: ${WORSHIP_Q_OIDC_ISSUER:-}
      WORSHIP_Q_OIDC_CLIENT_ID: ${WORSHIP_Q_OIDC_CLIENT_ID:-}
      WORSHIP_Q_OIDC_CLIENT_SECRET: ${WORSHIP_Q_OIDC_CLIENT_SECRET:-}
      WORSHIP_Q_PUBLIC_URL: ${WORSHIP_Q_PUBLIC_URL:-}
      # E-mail addresses made administrators at start, comma-separated.
      WORSHIP_Q_ADMINS: ${WORSHIP_Q_ADMINS:-}
      # Days a deleted song's or background's files are kept.
      WORSHIP_Q_RETENTION_DAYS: ${WORSHIP_Q_RETENTION_DAYS:-90}
      # Upload limits in MB, per kind of media. The reverse proxy's body limit must be at
      # least the largest of them.
      WORSHIP_Q_MAX_IMAGE_MB: ${WORSHIP_Q_MAX_IMAGE_MB:-25}
      WORSHIP_Q_MAX_DECK_MB: ${WORSHIP_Q_MAX_DECK_MB:-200}
      WORSHIP_Q_MAX_VIDEO_MB: ${WORSHIP_Q_MAX_VIDEO_MB:-200}
    # Your reverse proxy forwards to this port; it is only reachable from this machine.
    ports:
      - '127.0.0.1:${WORSHIP_Q_PORT:-8080}:8080'
    volumes:
      - worship-q-data:/data

volumes:
  worship-q-data:
